[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "hcu-infra-agent"
version = "0.1.0"
description = "Evidence-driven HCU large-model inference agent workflows"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "tomli>=2; python_version < '3.11'"]

[project.scripts]
hcu-infra-agent = "hcu_infra_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
