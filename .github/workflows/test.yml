name: inference-workflow
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/check_skill_resources.py
      - run: hcu-infra-agent demo /tmp/hcu-inference-demo
      - run: python scripts/install_skills.py --target /tmp/hcu-inference-skills
